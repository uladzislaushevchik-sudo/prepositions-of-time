<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Предлоги времени · Interactive</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px;color:#333">Загрузка упражнений…</p>
<script>
async function go() {
  const n = 5;
  const names = Array.from({length: n}, (_, i) => "c" + i + ".txt");
  const parts = await Promise.all(names.map(name => fetch(name).then(r => {
    if (!r.ok) throw new Error("Не удалось загрузить " + name + " (" + r.status + ")");
    return r.text();
  })));
  const bin = atob(parts.join(""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
}
go().catch(e => {
  document.body.innerHTML = "<div style=\"font-family:system-ui;text-align:center;padding:40px 20px\"><p style=\"color:#c62828;font-size:1.1rem\">Ошибка загрузки</p><p style=\"color:#666;margin-top:12px\">" + e.message + "</p><p style=\"margin-top:20px;font-size:0.9rem\">Открой файл <b>Prepositions_of_Time_Interactive.html</b> напрямую из папки проекта.</p></div>";
});
</script>
</body>
</html>
