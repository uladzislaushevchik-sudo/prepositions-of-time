<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Предлоги времени</title>
</head>
<body style="font-family:system-ui;text-align:center;padding:40px;background:#f5f7fa;color:#333">
<p id="s">Загрузка…</p>
<script>
(async()=>{
  try{
    const n=7;
    let s="";
    for(let i=0;i<n;i++){
      const r=await fetch("c"+i+".txt");
      if(!r.ok) throw new Error("chunk "+i+" "+r.status);
      s+=await r.text();
    }
    const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("s").innerHTML="<b style=color:#c62828>Ошибка: "+e.message+"</b>";
  }
})();
</script>
</body>
</html>
